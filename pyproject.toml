[tool.ruff]
line-length = 100
target-version = "py313"   # ADR-006: Python 3.13, no 3.12

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "DJ", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "N806", "I001"]
"config/settings/*.py" = ["F405", "I001"]  # `from .base import *` va primero a propósito

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps"]
# En paralelo por defecto (2026-10-28). `TenantTestCase` crea un esquema y le corre todas
# las migraciones en cada clase: medido con `--durations=0`, un `setup` de 9,5 s frente a
# centésimas por prueba. Repartir las clases entre procesos no quita ese coste, lo paga en
# varios sitios a la vez — de 19:43 a 5:38 con ocho procesos. No escala al número de
# núcleos porque todos van contra el mismo Postgres.
# Para depurar una prueba suelta, `-n 0` devuelve la ejecución a un solo proceso.
addopts = "-n auto"
# "Test?*" y no "Test*": el modelo del catálogo se llama `Test` y pytest intentaba
# recolectarlo como clase de pruebas en cada módulo que lo importa.
python_classes = ["Test?*", "*Tests"]
filterwarnings = [
    # WhiteNoise avisa que STATIC_ROOT no existe hasta correr collectstatic (sólo tests).
    "ignore:No directory at:UserWarning",
]
